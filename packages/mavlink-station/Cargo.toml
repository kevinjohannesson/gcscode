[package]
name = "mavlink-station"
version = "0.1.0"
edition = "2024"
description = "gcscode's station process (ADR-0016, draft): for now, reads an EdgeTX radio and serves its raw input to the page over a local WebSocket. Sends nothing to any vehicle."
publish = false

[[bin]]
name = "gcscode-station"
path = "src/main.rs"

[dependencies]
# The radio reading and the profiles, shared with tools/radio-probe, which proves them.
radio-input = { path = "../../libs/radio-input" }
sdl3 = { version = "=0.22.1", features = ["build-from-source-static"] }
sdl3-sys = { version = "=0.7.3", features = [
  "no-sdl-audio",
  "no-sdl-camera",
  "no-sdl-gpu",
  "no-sdl-render",
  "no-sdl-dialog",
  "no-sdl-tray",
] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "=0.22.1", features = ["build-from-source-unix-console"] }
sdl3-sys = { version = "=0.7.3", features = ["no-sdl-video"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"
