# Unset keys keep MediaMTX's defaults. camera-sim publishes (WHIP) and the
# Video panel reads (WHEP) over WebRTC on 8889, ICE on UDP 8189; RTSP on 8554
# serves players such as VLC. The API, on loopback only, is what the launcher
# (scripts/dev-stack.mjs) reads the path list and the WebRTC session list from,
# at 127.0.0.1:9997.
# A path keeps its first publisher, so a camera-sim tab cannot take a stream the
# headless page publishes.
api: true
apiAddress: 127.0.0.1:9997
rtmp: false
hls: false
srt: false
moq: false
pathDefaults:
  overridePublisher: false
paths:
  all_others:
