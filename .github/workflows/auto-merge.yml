name: Auto-merge

# Auto-merges PRs when:
# Pre-gate: PR is not in draft state.
# Gate 1: The `auto-merge` label is present (user's opt-in signal).
# Gate 2: The PR's headRefName is `feat/*`, `spec/*`, or `adr/*`, or it is
#         `claude/*` and the PR carries exactly one of the labels `feat`, `spec`
#         or `adr`, which then stands in for the prefix (cloud sessions can push
#         only `claude/*` branches). A `spec/*` or `adr/*` PR, or a `claude/*`
#         one labelled `spec` or `adr`, changes nothing outside `docs/`, so code
#         cannot merge on a spec reviewer's count instead of gate 3a's final
#         review. Below, "feat/*" and "spec/* or adr/*" include those labelled
#         `claude/*` PRs.
# Gate 3: Bot signal — class-aware, and in both classes read from the reviews
#         API rather than from GitHub's computed reviewDecision, matching the bot
#         logins exactly (`[bot]` suffix included):
#         - feat/*: `gcscode-final-review`'s latest verdict-bearing review is
#           APPROVED. Was `reviewDecision == APPROVED` until 2026-10-20, which
#           could never pass: GitHub only computes reviewDecision when the base
#           branch has review requirements, and `master` is unprotected, so it
#           stayed empty however many approvals existed. PR #34 was the first
#           feat/* PR to reach this gate and exposed it.
#         - spec/* or adr/*: the latest review by `gcscode-red-team` ends with
#           the line `Blocking: 0`, and so does the latest review by
#           `gcscode-extension-architect` if it posted any, and each count agrees
#           with the findings that review tags as blocking. The reviewers grade
#           their own findings; this reads their count. If the review loop's
#           last review still counts blocking findings, the gate stays shut and
#           the owner decides. Was a review count (red-team >= 2,
#           spec-quality >= 1) until review-loop-v2 dropped the Sonnet red-team
#           and spec-quality roles.
#         In both classes the review that passes must cover the PR's current
#         head: for feat/*, that final approval; for spec/* or adr/*, the newest
#         review by either of those two reviewers. It covers the head when it
#         was posted on the head commit (the review's `commit_id`), or when the
#         PR's own changes are the same as at the reviewed commit: the diff
#         from where each commit leaves the base branch, compared by
#         `git patch-id --verbatim`, which ignores line numbers but not
#         whitespace. So merging the base branch in, or a rebase,
#         keeps the review, and a new commit, or a conflict resolution that
#         changes the PR's own lines, holds the merge until it is reviewed in
#         turn. A base-branch change right next to the PR's lines also changes
#         the diff's context, and holds it too. The merge names the head it
#         checked (`--match-head-commit`), so a push in between fails the merge
#         instead of riding in on the earlier review.
# Gate 4: The PR is mergeable (no conflicts).
# Gate 5: The `ci` check of `.github/workflows/ci.yml`, run by GitHub
#         Actions, succeeded on the head commit: its latest run, so a re-run
#         that fails closes the gate again. A PR waiting only on CI is
#         re-evaluated when the CI workflow completes (the `workflow_run`
#         trigger, which runs master's copy of this file).
#
# Specs: docs/specs/2026-05-14-auto-merge-on-user-approval.md,
#        docs/specs/2026-10-22-review-loop-v2.md (Gate 3b).
# The review loop itself: .claude/skills/review-loop/SKILL.md.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      # Full history, for comparing the reviewed commit's changes with the
      # head's (Gate 3). Nothing from the checkout is run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check gates and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.review.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "Could not determine PR number from event payload. Exiting."
            exit 0
          fi
          echo "Evaluating PR #${PR_NUMBER}"

          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName,headRefOid,baseRefName,labels,mergeable,isDraft)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .headRefOid)
          BASE_REF=$(echo "$PR_JSON" | jq -r .baseRefName)

          # Succeeds when a review posted on commit $1 covers the head (header,
          # Gate 3): it is the head, or the PR's own changes, from where each
          # leaves the base branch, have the same patch ID. A commit the checkout
          # lacks (one a rebase left behind) is fetched by SHA; anything that
          # cannot be compared fails closed. --verbatim, not --stable: --stable
          # ignores whitespace, so a whitespace-only commit (YAML indentation, a
          # space in a string) would ride in on the earlier review.
          review_covers_head() {
            local reviewed="$1" approved current
            [[ -n "$reviewed" ]] || return 1
            [[ "$reviewed" == "$HEAD_SHA" ]] && return 0
            # Anonymous fetches: this works while the repository is public.
            git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" "$HEAD_SHA" || { echo "Could not fetch ${BASE_REF} and the head from origin; cannot compare the reviewed changes."; return 1; }
            git cat-file -e "${reviewed}^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$reviewed" || { echo "Could not fetch the reviewed commit ${reviewed} from origin; cannot compare the reviewed changes."; return 1; }
            approved=$(git diff --binary "$(git merge-base "origin/${BASE_REF}" "$reviewed")" "$reviewed" | git patch-id --verbatim | cut -d' ' -f1) || return 1
            current=$(git diff --binary "$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")" "$HEAD_SHA" | git patch-id --verbatim | cut -d' ' -f1) || return 1
            [[ -n "$approved" && "$approved" == "$current" ]]
          }
          # The class a claude/* PR's type label names; the joined names when not exactly one.
          TYPE_LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name | select(. == "feat" or . == "spec" or . == "adr")] | unique | join(",")')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r .isDraft)
          MERGEABLE=$(echo "$PR_JSON" | jq -r .mergeable)
          HAS_LABEL=$(echo "$PR_JSON" | jq -r '[.labels[] | select(.name == "auto-merge")] | length')

          # Pre-gate (Gate 0): PR must not be in draft state.
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Pre-gate FAILED: PR is in draft state. Exiting cleanly."
            exit 0
          fi
          echo "Pre-gate OK: PR is not draft"

          # Gate 1: auto-merge label present
          if [[ "$HAS_LABEL" == "0" ]]; then
            echo "Gate 1 FAILED: auto-merge label not present. Exiting cleanly."
            exit 0
          fi
          echo "Gate 1 OK: auto-merge label present"

          # Gate 2: PR class detection. A claude/* head (the only prefix cloud
          # sessions may push) takes its class from exactly one type label, read
          # as if it were the branch prefix; none or several fails closed.
          CLASS_REF="$HEAD_REF"
          if [[ "$HEAD_REF" == claude/* ]]; then
            case "$TYPE_LABELS" in
              feat|spec|adr)
                CLASS_REF="${TYPE_LABELS}/${HEAD_REF}"
                echo "Gate 2: claude/ head '${HEAD_REF}' typed '${TYPE_LABELS}' by its label"
                ;;
              *)
                echo "Gate 2 FAILED: claude/ head '${HEAD_REF}' needs exactly one of the labels feat, spec or adr (has '${TYPE_LABELS}'). Exiting cleanly."
                exit 0
                ;;
            esac
          fi
          case "$CLASS_REF" in
            feat/*)
              echo "Gate 2 OK: feature PR (head=${HEAD_REF}); gate 3a (final-review verdict) applies"
              PR_CLASS=feat
              ;;
            spec/*|adr/*)
              # Spec and ADR PRs carry documents only. Anything else (scripts, agent
              # files, this workflow) belongs on a feat/ branch (or a claude/ one labelled
              # feat) behind gate 3a, or is merged by hand. Renames count by both names;
              # paginated like the reviews.
              OUTSIDE_DOCS=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | (.filename, (.previous_filename // empty)) | select(startswith("docs/") | not)')
              if [[ -n "$OUTSIDE_DOCS" ]]; then
                echo "Gate 2 FAILED: spec/ADR PR changes files outside docs/ (merge by hand, or move them to a feat/ branch; a claude/ head is relabelled feat instead):"
                echo "$OUTSIDE_DOCS"
                exit 0
              fi
              echo "Gate 2 OK: spec/ADR PR (head=${HEAD_REF}), documents only; gate 3b (reviewers' Blocking: 0) applies"
              PR_CLASS=spec_or_adr
              ;;
            *)
              echo "Gate 2 FAILED: head '${HEAD_REF}' is not feat/, spec/, adr/ or a labelled claude/. Exiting cleanly."
              exit 0
              ;;
          esac

          # Gate 3: bot signal (class-aware)
          if [[ "$PR_CLASS" == "feat" ]]; then
            # Gate 3a: `gcscode-final-review`'s latest verdict-bearing review must be
            # APPROVED. Latest-review-per-user semantics, the same thing PR #1's
            # validation established: take that author's most recent review, so a
            # CHANGES_REQUESTED later resolved does not block, and an older APPROVED
            # does not override a newer CHANGES_REQUESTED.
            #
            # Only APPROVED and CHANGES_REQUESTED are verdict-bearing, which mirrors
            # GitHub's own latest-non-comment-review-per-user rule. COMMENTED carries
            # no verdict (and the final reviewer is forbidden from posting one), and a
            # DISMISSED review must not count as an approval.
            #
            # Note this gate reads only the final reviewer. A per-task reviewer's
            # CHANGES_REQUESTED cannot be cleared within the verdict table — those
            # roles may never post --approve, and GitHub clears CHANGES_REQUESTED only
            # on a later APPROVED or a dismissal — so gating on it would deadlock.
            # Fetched with --paginate rather than read from PR_JSON: `gh pr view
            # --json reviews` can truncate at 100, and truncation here is the one
            # direction that fails OPEN — the oldest 100 are returned, so a newer
            # CHANGES_REQUESTED could be dropped while an older APPROVED survives.
            # Gate 3b reads the latest review too, so it paginates the same way.
            # Raised by the final cross-cutting review on PR #35.
            # The REST payload spells bot logins `gcscode-final-review[bot]` (checked
            # against PR #37), while `gh pr view --json reviews` omits the suffix, which
            # is one reason this reads REST. Match the full login: the `[bot]` suffix is
            # what tells the App from a user account of the same name, and any GitHub
            # user can review a public PR. Getting the spelling wrong fails closed and
            # silently, which is how the first version of this block broke.
            # `.user.login // ""` guards a null author (a deleted account), so one such
            # review cannot abort the gate alongside a valid final APPROVED.
            FINAL_REVIEWS=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '.[] | {login: (.user.login // ""), state, submittedAt: .submitted_at, commitId: (.commit_id // "")}' | jq -s '{reviews: .}')
            FINAL_REVIEW=$(echo "$FINAL_REVIEWS" | jq -c '
              [ .reviews[]
                | select(.login == "gcscode-final-review[bot]")
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") ]
              | sort_by(.submittedAt)
              | last
              | {state: (.state // "NONE"), commitId: (.commitId // "")}')
            FINAL_REVIEW_STATE=$(echo "$FINAL_REVIEW" | jq -r .state)
            FINAL_REVIEW_COMMIT=$(echo "$FINAL_REVIEW" | jq -r .commitId)
            if [[ "$FINAL_REVIEW_STATE" != "APPROVED" ]]; then
              echo "Gate 3a FAILED: latest verdict-bearing review by gcscode-final-review is '${FINAL_REVIEW_STATE}' (expected APPROVED). Exiting cleanly."
              exit 0
            fi
            # The approval covers the changes it saw, not later ones (header, Gate 3).
            if ! review_covers_head "$FINAL_REVIEW_COMMIT"; then
              echo "Gate 3a FAILED: gcscode-final-review approved '${FINAL_REVIEW_COMMIT}', and the PR's changes at head '${HEAD_SHA}' differ from it; the difference is unreviewed. Exiting cleanly."
              exit 0
            fi
            echo "Gate 3a OK: gcscode-final-review's latest verdict-bearing review is APPROVED, of ${FINAL_REVIEW_COMMIT}, which carries the head ${HEAD_SHA}'s changes"
          else
            # Gate 3b: the last non-blank line of `gcscode-red-team[bot]`'s latest review
            # is `Blocking: 0`, and the same for `gcscode-extension-architect[bot]` if it
            # has reviewed at all (its out-of-scope skip ends `Blocking: 0` too). The
            # count must also agree with the review's own tags — distinct finding IDs
            # tagged `[blocking]`, or `[not resolved]` / `[partly resolved]` followed by
            # `[blocking]` — so a miscounted trailer cannot wave a listed blocker through.
            # Every other outcome fails closed: no red-team review yet, a missing
            # trailer, a count mismatch, or any non-zero count.
            # Commits pushed after the latest review are caught twice: the review-loop
            # skill keeps the PR in draft until the loop's last review (the pre-gate
            # refuses drafts), and the newest review by either reviewer must cover
            # the head (checked below; header, Gate 3). Only the newest across both is read,
            # because the loop's closing fix check comes only from the role whose
            # findings the closing commit records, so the other's latest review is
            # legitimately of an earlier commit.
            # Same exact logins, null-author guard and pagination as gate 3a above.
            SPEC_REVIEWS=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '.[] | {login: (.user.login // ""), submittedAt: .submitted_at, commitId: (.commit_id // ""), body: (.body // "")}' | jq -s '{reviews: .}')
            # Prints the N of the trailer when it agrees with the blocking tags; NONE if
            # the login never reviewed; MISSING if the latest review has no `Blocking: N`
            # last line; MISMATCH(...) if N and the tags disagree.
            latest_blocking() {
              echo "$SPEC_REVIEWS" | jq -r --arg login "$1" '
                [ .reviews[] | select(.login == $login and .submittedAt != null) ]
                | sort_by(.submittedAt) | last
                | if . == null then "NONE"
                  else (.body | gsub("\r"; "")) as $body
                    | ([ $body | split("\n")[] | select(test("\\S")) ] | last // ""
                        | (capture("^\\s*Blocking:\\s*(?<n>[0-9]+)\\s*$") | .n) // "MISSING") as $n
                    | ([ $body | scan("\\*{0,2}\\b([A-Z]{2,4}-[0-9]{1,3})\\b\\*{0,2}\\s*\\[(blocking|non-blocking|resolved|not resolved|partly resolved)\\](?:\\s*\\[(blocking|non-blocking)\\])?") ]
                        | reduce .[] as $m ({}; if has($m[0]) then . else . + {($m[0]): $m} end)
                        | [ .[] | select(.[1] == "blocking" or ((.[1] == "not resolved" or .[1] == "partly resolved") and .[2] == "blocking")) ]
                        | length) as $tagged
                    | if $n == "MISSING" then "MISSING"
                      elif ($n | tonumber) != $tagged then "MISMATCH(trailer \($n), \($tagged) tagged)"
                      else $n end
                  end'
            }
            REDTEAM_BLOCKING=$(latest_blocking "gcscode-red-team[bot]")
            ARCHITECT_BLOCKING=$(latest_blocking "gcscode-extension-architect[bot]")
            if [[ "$REDTEAM_BLOCKING" != "0" ]]; then
              echo "Gate 3b FAILED: gcscode-red-team's latest review reads Blocking=${REDTEAM_BLOCKING} (expected 0). Exiting cleanly."
              exit 0
            fi
            if [[ "$ARCHITECT_BLOCKING" != "NONE" && "$ARCHITECT_BLOCKING" != "0" ]]; then
              echo "Gate 3b FAILED: gcscode-extension-architect's latest review reads Blocking=${ARCHITECT_BLOCKING} (expected 0). Exiting cleanly."
              exit 0
            fi
            NEWEST_SPEC_REVIEW_COMMIT=$(echo "$SPEC_REVIEWS" | jq -r '
              [ .reviews[]
                | select(.login == "gcscode-red-team[bot]" or .login == "gcscode-extension-architect[bot]")
                | select(.submittedAt != null) ]
              | sort_by(.submittedAt) | last | .commitId // ""')
            if ! review_covers_head "$NEWEST_SPEC_REVIEW_COMMIT"; then
              echo "Gate 3b FAILED: the newest red-team or extension-architect review is of '${NEWEST_SPEC_REVIEW_COMMIT}', and the PR's changes at head '${HEAD_SHA}' differ from it; the difference is unreviewed. Exiting cleanly."
              exit 0
            fi
            echo "Gate 3b OK: red-team Blocking=0, extension-architect Blocking=${ARCHITECT_BLOCKING}, newest review of ${NEWEST_SPEC_REVIEW_COMMIT}, which carries the head ${HEAD_SHA}'s changes"
          fi

          # Gate 4: PR is mergeable
          if [[ "$MERGEABLE" != "MERGEABLE" ]]; then
            echo "Gate 4 FAILED: PR mergeable state is '${MERGEABLE}' (expected MERGEABLE). Exiting cleanly."
            exit 0
          fi
          echo "Gate 4 OK: PR is mergeable"

          # Gate 5: CI green on the head. Only GitHub Actions' own check runs count,
          # so no other App can post a passing `ci`.
          CI_CONCLUSION=$(gh api --paginate "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?check_name=ci" --jq '.check_runs[] | select(.app.slug == "github-actions") | {startedAt: .started_at, conclusion: (.conclusion // "pending")}' | jq -rs 'sort_by(.startedAt) | last | .conclusion // "NONE"')
          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "Gate 5 FAILED: the ci check on head ${HEAD_SHA} is '${CI_CONCLUSION}' (expected success). The CI workflow's completion re-runs this gate. Exiting cleanly."
            exit 0
          fi
          echo "Gate 5 OK: ci succeeded on head ${HEAD_SHA}"

          # All gates pass — merge
          # --match-head-commit: a push after the reads above fails the merge rather
          # than merging a commit no gate looked at.
          echo "All gates passed; merging PR #${PR_NUMBER} at ${HEAD_SHA} via --merge --delete-branch"
          gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$HEAD_SHA"
