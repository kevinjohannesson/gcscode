name: Auto-merge

# Auto-merges PRs when:
# Pre-gate: PR is not in draft state.
# Gate 1: The `auto-merge` label is present (user's opt-in signal).
# Gate 2: The PR's headRefName is `feat/*`, `spec/*`, or `adr/*`.
# Gate 3: Bot signal — class-aware, and in both classes read from the reviews
#         API rather than from GitHub's computed reviewDecision:
#         - feat/*: `gcscode-final-review`'s latest verdict-bearing review is
#           APPROVED. Was `reviewDecision == APPROVED` until 2026-10-20, which
#           could never pass: GitHub only computes reviewDecision when the base
#           branch has review requirements, and `master` is unprotected, so it
#           stayed empty however many approvals existed. PR #34 was the first
#           feat/* PR to reach this gate and exposed it.
#         - spec/* or adr/*: the latest review by `gcscode-red-team` ends with
#           the line `Blocking: 0`, and so does the latest review by
#           `gcscode-extension-architect` if it posted any. The reviewers grade
#           their own findings; this reads their count. If blocking findings
#           remain after two fix checks, the gate stays shut and the owner
#           decides. Was a review count (red-team >= 2, spec-quality >= 1) until
#           review-loop-v2 dropped the Sonnet red-team and spec-quality roles.
# Gate 4: The PR is mergeable (no conflicts).
#
# Specs: docs/specs/2026-05-14-auto-merge-on-user-approval.md,
#        docs/specs/2026-10-22-review-loop-v2.md (Gate 3b)

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check gates and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.review.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "Could not determine PR number from event payload. Exiting."
            exit 0
          fi
          echo "Evaluating PR #${PR_NUMBER}"

          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName,labels,mergeable,isDraft)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          IS_DRAFT=$(echo "$PR_JSON" | jq -r .isDraft)
          MERGEABLE=$(echo "$PR_JSON" | jq -r .mergeable)
          HAS_LABEL=$(echo "$PR_JSON" | jq -r '[.labels[] | select(.name == "auto-merge")] | length')

          # Pre-gate (Gate 0): PR must not be in draft state.
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Pre-gate FAILED: PR is in draft state. Exiting cleanly."
            exit 0
          fi
          echo "Pre-gate OK: PR is not draft"

          # Gate 1: auto-merge label present
          if [[ "$HAS_LABEL" == "0" ]]; then
            echo "Gate 1 FAILED: auto-merge label not present. Exiting cleanly."
            exit 0
          fi
          echo "Gate 1 OK: auto-merge label present"

          # Gate 2: PR class detection
          case "$HEAD_REF" in
            feat/*)
              echo "Gate 2 OK: feature PR (head=${HEAD_REF}); gate 3a (final-review verdict) applies"
              PR_CLASS=feat
              ;;
            spec/*|adr/*)
              echo "Gate 2 OK: spec/ADR PR (head=${HEAD_REF}); gate 3b (reviewers' Blocking: 0) applies"
              PR_CLASS=spec_or_adr
              ;;
            *)
              echo "Gate 2 FAILED: head '${HEAD_REF}' is not feat/, spec/, or adr/. Exiting cleanly."
              exit 0
              ;;
          esac

          # Gate 3: bot signal (class-aware)
          if [[ "$PR_CLASS" == "feat" ]]; then
            # Gate 3a: `gcscode-final-review`'s latest verdict-bearing review must be
            # APPROVED. Latest-review-per-user semantics, the same thing PR #1's
            # validation established: take that author's most recent review, so a
            # CHANGES_REQUESTED later resolved does not block, and an older APPROVED
            # does not override a newer CHANGES_REQUESTED.
            #
            # Only APPROVED and CHANGES_REQUESTED are verdict-bearing, which mirrors
            # GitHub's own latest-non-comment-review-per-user rule. COMMENTED carries
            # no verdict (and the final reviewer is forbidden from posting one), and a
            # DISMISSED review must not count as an approval.
            #
            # Note this gate reads only the final reviewer. A per-task reviewer's
            # CHANGES_REQUESTED cannot be cleared within the verdict table — those
            # roles may never post --approve, and GitHub clears CHANGES_REQUESTED only
            # on a later APPROVED or a dismissal — so gating on it would deadlock.
            # Fetched with --paginate rather than read from PR_JSON: `gh pr view
            # --json reviews` can truncate at 100, and truncation here is the one
            # direction that fails OPEN — the oldest 100 are returned, so a newer
            # CHANGES_REQUESTED could be dropped while an older APPROVED survives.
            # Gate 3b reads the latest review too, so it paginates the same way.
            # Raised by the final cross-cutting review on PR #35.
            # The REST payload spells bot logins `gcscode-final-review[bot]`, while
            # `gh pr view --json reviews` omits the suffix. Normalise so the match is
            # spelling-agnostic — getting this wrong fails closed and silently, which
            # is how the first version of this block broke.
            # `.user.login // ""` guards a null author: `sub` on null raises, which
            # would abort the gate, so a single review by a deleted account would
            # otherwise brick auto-merge even alongside a valid final APPROVED.
            FINAL_REVIEWS=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '.[] | {login: ((.user.login // "") | sub("\\[bot\\]$"; "")), state, submittedAt: .submitted_at}' | jq -s '{reviews: .}')
            FINAL_REVIEW_STATE=$(echo "$FINAL_REVIEWS" | jq -r '
              [ .reviews[]
                | select(.login == "gcscode-final-review")
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") ]
              | sort_by(.submittedAt)
              | last
              | .state // "NONE"')
            if [[ "$FINAL_REVIEW_STATE" != "APPROVED" ]]; then
              echo "Gate 3a FAILED: latest verdict-bearing review by gcscode-final-review is '${FINAL_REVIEW_STATE}' (expected APPROVED). Exiting cleanly."
              exit 0
            fi
            echo "Gate 3a OK: gcscode-final-review's latest verdict-bearing review is APPROVED"
          else
            # Gate 3b: the last non-blank line of `gcscode-red-team`'s latest review is
            # `Blocking: 0`, and the same for `gcscode-extension-architect` if it has
            # reviewed at all (its out-of-scope skip ends `Blocking: 0` too). Every
            # other outcome fails closed: no red-team review yet, a missing trailer,
            # or any non-zero count. A fix check replaces the round it checks, so
            # after a Code-review-followup commit the gate stays shut until the
            # reviewer's fix check lands. Same login normalisation, null-author guard
            # and pagination as gate 3a above.
            SPEC_REVIEWS=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '.[] | {login: ((.user.login // "") | sub("\\[bot\\]$"; "")), submittedAt: .submitted_at, body: (.body // "")}' | jq -s '{reviews: .}')
            # Prints the N of the trailer, NONE if the login never reviewed, MISSING if the
            # latest review has no `Blocking: N` last line.
            latest_blocking() {
              echo "$SPEC_REVIEWS" | jq -r --arg login "$1" '
                [ .reviews[] | select(.login == $login and .submittedAt != null) ]
                | sort_by(.submittedAt) | last
                | if . == null then "NONE"
                  else [ .body | gsub("\r"; "") | split("\n")[] | select(test("\\S")) ] | last // ""
                    | (capture("^\\s*Blocking:\\s*(?<n>[0-9]+)\\s*$") | .n) // "MISSING"
                  end'
            }
            REDTEAM_BLOCKING=$(latest_blocking gcscode-red-team)
            ARCHITECT_BLOCKING=$(latest_blocking gcscode-extension-architect)
            if [[ "$REDTEAM_BLOCKING" != "0" ]]; then
              echo "Gate 3b FAILED: gcscode-red-team's latest review reads Blocking=${REDTEAM_BLOCKING} (expected 0). Exiting cleanly."
              exit 0
            fi
            if [[ "$ARCHITECT_BLOCKING" != "NONE" && "$ARCHITECT_BLOCKING" != "0" ]]; then
              echo "Gate 3b FAILED: gcscode-extension-architect's latest review reads Blocking=${ARCHITECT_BLOCKING} (expected 0). Exiting cleanly."
              exit 0
            fi
            echo "Gate 3b OK: red-team Blocking=0, extension-architect Blocking=${ARCHITECT_BLOCKING}"
          fi

          # Gate 4: PR is mergeable
          if [[ "$MERGEABLE" != "MERGEABLE" ]]; then
            echo "Gate 4 FAILED: PR mergeable state is '${MERGEABLE}' (expected MERGEABLE). Exiting cleanly."
            exit 0
          fi
          echo "Gate 4 OK: PR is mergeable"

          # All gates pass — merge
          echo "All gates passed; merging PR #${PR_NUMBER} via --merge --delete-branch"
          gh pr merge "$PR_NUMBER" --merge --delete-branch
