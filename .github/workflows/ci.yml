name: CI

# Runs the repository's own checks on every pull request, and on pushes to
# master. Merges made by the auto-merge workflow push with GITHUB_TOKEN, which
# starts no workflow, so only merges made by hand run CI on master; every
# auto-merged head passed CI as a PR first.
# The checks: `pnpm check`, `pnpm lint` and `pnpm test` (the JS and TypeScript packages,
# then the root tooling tests), `cargo test` for the two Rust packages, and on a
# pull request its ticket line (`scripts/check-pr-ticket.mjs`).
# The auto-merge gate requires this workflow's latest run on the PR's head
# commit to have succeeded (`.github/workflows/auto-merge.yml`, Gate 5), and the
# workflow's completion re-runs the gate, so a PR that was waiting on CI merges
# when it turns green.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR cancels its older run. Master runs are not cancelled
  # while running, though a third queued one replaces the one waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One check that sums up the run. The ruleset "master: CI must pass" requires it
  # by this name (`ci`), so renaming the job blocks every merge into master until
  # the ruleset is updated.
  # It succeeds only when every job it needs succeeded, so adding a job means
  # adding it here. Not skipped when a job fails; on a cancel it may end skipped.
  ci:
    runs-on: ubuntu-latest
    needs: [node, rust, ticket]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: ${RESULTS}"
          echo "$RESULTS" | jq -e 'all(. == "success")' > /dev/null

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # libs/map-gl-svelte runs its tests in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: libs/map-gl-svelte
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  # The PR names its Linear ticket as the review loop's PR templates ask, and a
  # ticket with a smoke test is not closed by the merge. The script reads the PR
  # from the API, so after fixing its body a re-run of this job sees the fix; on a
  # push to master it does nothing. It needs no install, only Node.
  ticket:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pr-ticket.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # radio-probe and mavlink-station both depend on libs/radio-input by path.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/radio-input/target
            packages/mavlink-station/target
            tools/radio-probe/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo test --locked
        working-directory: libs/radio-input
      - run: cargo test --locked
        working-directory: tools/radio-probe
      - run: cargo test --locked
        working-directory: packages/mavlink-station
