name: CI

# Runs the repository's own checks on every pull request and on master:
# `pnpm check`, `pnpm lint` and `pnpm test` (the JS and TypeScript packages,
# then the root tooling tests), and `cargo test` for the two Rust packages.
# The auto-merge gate requires this workflow's `ci` check to have succeeded on
# the PR's head commit (`.github/workflows/auto-merge.yml`, Gate 5), and the
# workflow's completion re-runs the gate, so a PR that was waiting on CI merges
# when it turns green.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one check the auto-merge gate reads. It succeeds only when every job
  # it needs succeeded, so adding a job means adding it here.
  ci:
    runs-on: ubuntu-latest
    needs: [node, rust]
    if: always()
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: ${RESULTS}"
          echo "$RESULTS" | jq -e 'all(. == "success")' > /dev/null

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # libs/map-gl-svelte runs its tests in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: libs/map-gl-svelte
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # mavlink-station depends on radio-probe by path, so its tests build both.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/mavlink-station/target
            tools/radio-probe/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --locked
        working-directory: tools/radio-probe
      - run: cargo test --locked
        working-directory: packages/mavlink-station
